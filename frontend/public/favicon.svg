<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer rounded background square -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" />

  <!-- Outer orbital eco-ring (representing the World Wide Web) -->
  <ellipse cx="50" cy="50" rx="36" ry="18" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-28 50 50)" stroke-dasharray="4 2" />
  <circle cx="20" cy="38" r="3" fill="#6ee7b7" />
  <circle cx="80" cy="62" r="3.5" fill="#34d399" filter="url(#glow)" />

  <!-- Stylized eco-globe meridians -->
  <path d="M 50 16 A 34 34 0 0 0 50 84" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" fill="none" />
  <path d="M 50 16 A 34 34 0 0 1 50 84" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" fill="none" />
  <line x1="16" y1="50" x2="84" y2="50" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />

  <!-- Central modern sustainable leaf -->
  <path d="M 50 22 C 34 35 32 60 48 74 C 66 72 74 46 50 22 Z" fill="url(#leafGrad)" filter="url(#glow)" />
  
  <!-- Leaf central spine / vein representing digital circuit connectivity -->
  <path d="M 48 73 Q 49 52 50 28" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 49 58 Q 43 53 39 52" stroke="#047857" stroke-width="2" stroke-linecap="round" />
  <path d="M 49.5 46 Q 57 42 62 43" stroke="#047857" stroke-width="2" stroke-linecap="round" />
</svg>

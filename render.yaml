services:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Backend: Flask REST API (Render Web Service)
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: greenweb-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///greenweb.db

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Frontend: React + Vite Single Page Application (Render Static Site)
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: greenweb-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://greenweb-api.onrender.com
